version: '3.8'

services:
  # MySQL database server with sample databases
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Example 1: Single database backup (legacy mode)
  backup-single:
    image: ghcr.io/unb-libraries/mysql-backup:latest
    container_name: backup-single
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_USER_NAME: root
      MYSQL_USER_PASSWORD: rootpassword
      MYSQL_DATABASE: app1
      MYSQL_STRUCT_TABLES: "cache_*,sessions"
    volumes:
      - ./backups/single:/data
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment to run automatically
    # command: hourly

  # Example 2: Multiple databases (explicit list)
  backup-multiple:
    image: ghcr.io/unb-libraries/mysql-backup:latest
    container_name: backup-multiple
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_USER_NAME: root
      MYSQL_USER_PASSWORD: rootpassword
      MYSQL_DATABASES: "app1,app2,app3"
      MYSQL_STRUCT_TABLES: "cache_*,sessions"
    volumes:
      - ./backups/multiple:/data
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment to run automatically
    # command: daily

  # Example 3: Auto-discovery (all databases)
  backup-all:
    image: ghcr.io/unb-libraries/mysql-backup:latest
    container_name: backup-all
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_USER_NAME: root
      MYSQL_USER_PASSWORD: rootpassword
      MYSQL_BACKUP_ALL_DATABASES: "true"
      MYSQL_EXCLUDE_DATABASES: "information_schema,performance_schema,mysql,sys"
    volumes:
      - ./backups/all:/data
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment to run automatically
    # command: weekly

  # Example 4: Per-database structure-only tables
  backup-per-db-config:
    image: ghcr.io/unb-libraries/mysql-backup:latest
    container_name: backup-per-db-config
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_USER_NAME: root
      MYSQL_USER_PASSWORD: rootpassword
      MYSQL_DATABASES: "app1,app2"
      # Per-database structure-only tables
      MYSQL_STRUCT_TABLES_APP1: "cache_*,sessions,watchdog"
      MYSQL_STRUCT_TABLES_APP2: "temp_*,cache"
      # Retention policy
      RSNAPSHOT_RETAIN_HOURLY: 24
      RSNAPSHOT_RETAIN_DAILY: 7
      RSNAPSHOT_RETAIN_WEEKLY: 4
      RSNAPSHOT_RETAIN_MONTHLY: 12
    volumes:
      - ./backups/per-db:/data
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment to run automatically
    # command: hourly

volumes:
  mysql-data:

# Usage instructions:
#
# 1. Create sample databases (optional):
#    Create a file 'init-db.sql' with:
#
#    CREATE DATABASE IF NOT EXISTS app2;
#    CREATE DATABASE IF NOT EXISTS app3;
#
#    USE app1;
#    CREATE TABLE cache_data (id INT, data TEXT);
#    CREATE TABLE sessions (id INT, session_data TEXT);
#    CREATE TABLE users (id INT, username VARCHAR(50));
#    INSERT INTO users VALUES (1, 'alice'), (2, 'bob');
#
#    USE app2;
#    CREATE TABLE temp_files (id INT, filename VARCHAR(255));
#    CREATE TABLE cache (id INT, data TEXT);
#    CREATE TABLE posts (id INT, title VARCHAR(255));
#    INSERT INTO posts VALUES (1, 'Hello World'), (2, 'Second Post');
#
# 2. Start MySQL server:
#    docker-compose up -d mysql
#
# 3. Run one of the backup examples:
#    docker-compose run --rm backup-single hourly
#    docker-compose run --rm backup-multiple daily
#    docker-compose run --rm backup-all weekly
#    docker-compose run --rm backup-per-db-config hourly
#
# 4. Check backup files:
#    ls -la backups/single/hourly.0/mysql/
#    ls -la backups/multiple/daily.0/mysql/
#    ls -la backups/all/weekly.0/mysql/
#
# 5. Schedule with cron (on host):
#    0 * * * * cd /path/to/project && docker-compose run --rm backup-all hourly
#    0 2 * * * cd /path/to/project && docker-compose run --rm backup-all daily
#    0 3 * * 0 cd /path/to/project && docker-compose run --rm backup-all weekly
#    0 4 1 * * cd /path/to/project && docker-compose run --rm backup-all monthly
